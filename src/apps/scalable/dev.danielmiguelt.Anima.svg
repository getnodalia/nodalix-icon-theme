<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Ánima</title>
  <!-- Ánima app icon on the Colloid application grid (scripts/icons.sh). -->
  <g fill="#000"><rect x="16" y="21" width="224" height="224" rx="51.5" opacity="0.05"/><rect x="14.8" y="19.8" width="226.4" height="226.4" rx="52.7" opacity="0.04"/><rect x="13.6" y="18.6" width="228.8" height="228.8" rx="53.9" opacity="0.03"/><rect x="12.5" y="17.5" width="231" height="231" rx="55" opacity="0.025"/></g>
  <g transform="translate(16 16) scale(0.4375)">
  <!-- Ánima app icon: a ball's arc through three keyframes, onion-skinned, over its tween span on
       the timeline. Original artwork for Ánima, MIT OR Apache-2.0 (assets/app-icon/LICENSE.txt). -->
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="117.71"/></clipPath>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b4ce8"/>
      <stop offset="1" stop-color="#5034c6"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#field)"/>
    <!-- Colloid's rims: a light edge on top, a darker one below. -->
    <rect width="512" height="8" fill="#fff" opacity=".15"/>
    <rect y="504" width="512" height="8" fill="#000" opacity=".2"/>
    <!-- The motion path, one dot per in-between frame. -->
    <path d="M128 304 Q256 4 384 304" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-dasharray="0 30" stroke-dashoffset="-6" opacity=".6"/>
    <!-- Onion skins: the earlier keyframes, paler the further back. -->
    <ellipse cx="128" cy="304" rx="50" ry="40" transform="rotate(-67 128 304)" fill="#8f76f0"/>
    <circle cx="256" cy="154" r="52" fill="#b4a4f7"/>
    <!-- The ball now, squashed as it lands. -->
    <ellipse cx="384" cy="318" rx="76" ry="58" fill="#ff7a59"/>
    <ellipse cx="356" cy="294" rx="26" ry="15" transform="rotate(-16 356 294)" fill="#fff" opacity=".45"/>
    <!-- Its timeline: the tween span, a keyframe under each pose. -->
    <rect x="72" y="414" width="368" height="44" rx="22" fill="#2a1a78" opacity=".6"/>
    <rect x="128" y="430" width="256" height="12" rx="6" fill="#b4a4f7"/>
    <path d="M128 416l20 20-20 20-20-20z" fill="#8f76f0"/>
    <path d="M256 416l20 20-20 20-20-20z" fill="#e4dcff"/>
    <path d="M384 416l20 20-20 20-20-20z" fill="#ff7a59"/>
  </g>
</g>
</svg>
